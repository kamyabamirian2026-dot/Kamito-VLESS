<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAMITO VLESS</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:#0d0d12;
color:#fff;
font-family:Arial,sans-serif;
}
header{
background:#191920;
padding:22px;
border-bottom:2px solid #ef233c;
}
.logo{color:#ff3048;font-size:25px;font-weight:bold}
main{max-width:900px;margin:30px auto;padding:15px}
.card{
background:#1b1b24;
padding:22px;
border-radius:15px;
border:1px solid #30303b;
margin-bottom:18px;
}
.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}
.number{font-size:30px;color:#ff3048}
button{
background:#e9233b;
border:0;
color:white;
padding:12px 20px;
border-radius:9px;
}
.status{color:#aaa}
@media(max-width:500px){
.stats{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
<div class="logo">KAMITO VLESS</div>
<div>پنل مدیریت اختصاصی</div>
</header>
<main>
<div class="card">
<h2>خوش آمدید 👋</h2>
<p>مدیریت سرویس‌های Kamito</p>
</div>
<div class="stats">
<div class="card">
کاربران
<div class="number">0</div>
</div>
<div class="card">
کانفیگ‌ها
<div class="number">0</div>
</div>
</div>
<div class="card">
<h3>وضعیت سیستم</h3>
<p class="status">پنل اولیه آماده است.</p>
</div>
</main>
</body>
</html>
